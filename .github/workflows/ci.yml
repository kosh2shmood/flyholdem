name: fixture-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen
      - run: make test
      - run: uv run python -m playwright install --with-deps chromium
      - name: Live and replay browser verification
        run: |
          uv run flyholdem serve --port 8766 > /tmp/flyholdem-server.log 2>&1 &
          uv run python -c "import time, urllib.request; exec('for i in range(60):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8766/api/health\"); break\n except OSError: time.sleep(1)\nelse: raise RuntimeError(\"Server unavailable\")')"
          make browser-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-browser-evidence
          path: docs/review/
